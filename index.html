      <h1>Bunny Skip</h1>
      <p>
        Bunny Skip is a Chrome extension that automatically clicks "Skip
        Intro," "Skip Recap," and "Next Episode" prompts across seven
        streaming platforms — Netflix, Prime Video, Disney+, Hulu, Max, Apple
        TV+, and Paramount+. Match rules are stored as data, not hardcoded
        per-site code, so a broken rule is fixed by re-picking the button in
        the popup — no code changes required. It makes zero network calls,
        has no backend, and collects no telemetry.
      </p>
