    <!--
      THESIS: Bunny Skip owns "the mechanism is data, not code" — refusing
      the icon-grid feature list for a page that shows the match/click/sync
      loop itself, then proves the seven-platform reach and the zero-network
      trust story.
      OWN-WORLD: warm cream paper ground, near-black night panels, a
      saturated sun-orange field that owns whole sections; Unbounded
      (geometric, all-caps display) against Literata (warm humanist serif,
      body/quotes); the sun/moon disc as a recurring compositional ring.
      STORY: a streaming viewer meets a bunny leaping a skyline of invented
      UI chrome, learns the three-step mechanism, sees the seven platforms
      already reached, trusts the no-backend/no-telemetry/no-eval manifesto,
      and installs from the Chrome Web Store or reads the source on GitHub.
      FIRST VIEWPORT: full-bleed hero illustration under a scrim, wordmark
      nav top, an all-caps headline and serif subhead anchored bottom-left,
      dual CTA beneath it, seven-platform strip closing the fold.
      FORM: full-bleed illustrated hero over alternating light/dark panels,
      per the pinned surface brief (route.md) — concept-seed skipped by
      contract, brief pins the world. (Adapted from the brief's
      "painterly" language: no image-generation tool was available in any
      build session, so the hero shipped as hand-authored flat vector SVG,
      not painterly raster/brushwork. This line describes the built world,
      not the brief's aspiration.)
      FINISH: unreviewed and undocumented is unfinished; this build ends
      with the finish review, the verdict, DESIGN.md, and every shipping
