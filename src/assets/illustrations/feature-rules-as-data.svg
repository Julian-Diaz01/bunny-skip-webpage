<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Original illustration for the &quot;Rules as data&quot; feature: a stack of labeled data rows, not a screenshot of any real interface.">
  <!--
    PROVENANCE: Hand-authored original vector art, feature tile "Rules as
    data". Abstract iconography only (a data-row card with tag/toggle marks)
    — invented, not a screenshot or recreation of any real product UI.
    Palette matches the site's paper/night/sun token family.
  -->
  <defs>
    <radialGradient id="rd-glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#FFD9A0" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#FF8A3D" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF6A2A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="#F6EEDD"/>
  <circle cx="200" cy="160" r="190" fill="url(#rd-glow)"/>

  <!-- data card -->
  <rect x="80" y="120" width="240" height="200" rx="18" fill="#15110D"/>
  <rect x="80" y="120" width="240" height="200" rx="18" fill="none" stroke="#FF6A2A" stroke-opacity="0.35" stroke-width="2"/>

  <!-- three "rule rows" as data, each a key + a toggle -->
  <g>
    <rect x="106" y="152" width="120" height="14" rx="7" fill="#F6EEDD" fill-opacity="0.85"/>
    <rect x="256" y="149" width="38" height="20" rx="10" fill="#FF6A2A"/>
    <circle cx="284" cy="159" r="7" fill="#FFD9A0"/>

    <rect x="106" y="196" width="150" height="14" rx="7" fill="#F6EEDD" fill-opacity="0.85"/>
    <rect x="272" y="193" width="38" height="20" rx="10" fill="#FF6A2A"/>
    <circle cx="300" cy="203" r="7" fill="#FFD9A0"/>

    <rect x="106" y="240" width="95" height="14" rx="7" fill="#F6EEDD" fill-opacity="0.6"/>
    <rect x="222" y="237" width="38" height="20" rx="10" fill="#3A2E20"/>
    <circle cx="238" cy="247" r="7" fill="#F6EEDD" fill-opacity="0.7"/>

    <rect x="106" y="284" width="130" height="14" rx="7" fill="#F6EEDD" fill-opacity="0.85"/>
    <rect x="256" y="281" width="38" height="20" rx="10" fill="#FF6A2A"/>
    <circle cx="284" cy="291" r="7" fill="#FFD9A0"/>
  </g>
</svg>
