<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Original illustration for the &quot;Element picker&quot; feature: a crosshair cursor selecting a pill-shaped button inside a dashed selection box, not a screenshot of any real interface.">
  <!--
    PROVENANCE: Hand-authored original vector art, feature tile "Element
    picker". Abstract iconography only (a crosshair cursor targeting a
    generic pill button inside a dashed selection outline) — invented, not
    a screenshot or recreation of any real product UI. Palette matches the
    site's paper/night/sun token family.
  -->
  <defs>
    <radialGradient id="ep-glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#FFD9A0" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#FF8A3D" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF6A2A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="#F6EEDD"/>
  <circle cx="200" cy="160" r="190" fill="url(#ep-glow)"/>

  <!-- generic UI panel being inspected -->
  <rect x="90" y="120" width="220" height="170" rx="14" fill="#15110D"/>
  <rect x="112" y="146" width="90" height="12" rx="6" fill="#F6EEDD" fill-opacity="0.55"/>
  <rect x="112" y="172" width="130" height="12" rx="6" fill="#F6EEDD" fill-opacity="0.35"/>

  <!-- the targeted element: a generic pill button -->
  <rect x="112" y="216" width="120" height="42" rx="21" fill="#3A2E20"/>

  <!-- dashed selection box around the targeted pill, picker mid-selection -->
  <rect x="100" y="204" width="146" height="66" rx="12" fill="none" stroke="#FF6A2A" stroke-width="3" stroke-dasharray="8 7"/>

  <!-- crosshair cursor -->
  <g stroke="#FF6A2A" stroke-width="4" stroke-linecap="round">
    <line x1="286" y1="238" x2="286" y2="286"/>
    <line x1="262" y1="262" x2="310" y2="262"/>
  </g>
  <circle cx="286" cy="262" r="7" fill="#FFD9A0"/>

  <!-- corner selection handles -->
  <g fill="#FFD9A0">
    <circle cx="100" cy="204" r="5"/>
    <circle cx="246" cy="204" r="5"/>
    <circle cx="100" cy="270" r="5"/>
    <circle cx="246" cy="270" r="5"/>
  </g>
</svg>
