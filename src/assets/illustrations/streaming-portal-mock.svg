<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 35 550 348" role="img" aria-label="Original illustration of a generic streaming portal: a browser window playing a video with a glowing auto-skip button (cycling &quot;SKIP INTRO&quot;, &quot;SKIP RECAP&quot;, &quot;NEXT EPISODE&quot;), a progress bar, and playback controls, not a screenshot of any real platform.">
  <defs>
    <!-- video-surface aura  -->
    <linearGradient id="spm-aura-1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop class="bsp-accent-stop-mid" offset="28%" stop-color="#FF7B9D" stop-opacity="0.12"/>
      <stop offset="18%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="68%" stop-color="#2D3787" stop-opacity="0.8"/>
      <stop class="bsp-accent-stop-deep" offset="100%" stop-color="#6B2A42" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="spm-aura-2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop class="bsp-accent-stop-mid" offset="34%" stop-color="#FF7B9D" stop-opacity="0.22"/>
      <stop offset="66%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="82%" stop-color="#2D3787" stop-opacity="0.7"/>
      <stop class="bsp-accent-stop-deep" offset="100%" stop-color="#6B2A42" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="spm-bg-glow" cx="50%" cy="46%" r="60%">
      <stop class="bsp-accent-stop" offset="0%" stop-color="#FFC9D6" stop-opacity="0.5"/>
      <stop class="bsp-accent-stop-mid" offset="60%" stop-color="#FF7B9D" stop-opacity="0"/>
      <stop class="bsp-accent-stop-mid" offset="100%" stop-color="#FE5F8C" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="spm-window-clip">
      <rect x="0" y="36" width="550" height="348" rx="8"/>
    </clipPath>

    <style>

      /* accent hue-cycle: holds each portal's accent, then morphs to the next */
      .bsp-accent-fill, .bsp-accent-stroke, .bsp-accent-stroke-light, .bsp-accent-stop, .bsp-accent-stop-mid, .bsp-accent-stop-deep {
        animation-duration: 12s;
        animation-timing-function: ease-in-out;
        animation-iteration-count: infinite;
      }
      .bsp-accent-fill { animation-name: bsp-accent-fill; }
      .bsp-accent-stroke { animation-name: bsp-accent-stroke; }
      .bsp-accent-stroke-light { animation-name: bsp-accent-stroke-light; }
      .bsp-accent-stop { animation-name: bsp-accent-stop; }
      .bsp-accent-stop-mid { animation-name: bsp-accent-stop-mid; }
      .bsp-accent-stop-deep { animation-name: bsp-accent-stop-deep; }

      /* video-surface aura layers: multiply-blend against the #FAF8F2 base rect beneath them */
      .bsp-aura-container { isolation: isolate; }
      .bsp-aura-layer {
        mix-blend-mode: multiply;
        filter: blur(22px);
      }

      @keyframes bsp-accent-fill {
        0%, 20% { fill: #FE5F8C; }
        25%, 45% { fill: #5FD0FE; }
        50%, 70% { fill: #C77DFF; }
        75%, 95% { fill: #FFB86B; }
        100% { fill: #FE5F8C; }
      }
      @keyframes bsp-accent-stroke {
        0%, 20% { stroke: #FE5F8C; }
        25%, 45% { stroke: #5FD0FE; }
        50%, 70% { stroke: #C77DFF; }
        75%, 95% { stroke: #FFB86B; }
        100% { stroke: #FE5F8C; }
      }
      @keyframes bsp-accent-stroke-light {
        0%, 20% { stroke: #FFC9D6; }
        25%, 45% { stroke: #C7ECFE; }
        50%, 70% { stroke: #E7D3FF; }
        75%, 95% { stroke: #FFE2C2; }
        100% { stroke: #FFC9D6; }
      }
      @keyframes bsp-accent-stop {
        0%, 20% { stop-color: #FFC9D6; }
        25%, 45% { stop-color: #C7ECFE; }
        50%, 70% { stop-color: #E7D3FF; }
        75%, 95% { stop-color: #FFE2C2; }
        100% { stop-color: #FFC9D6; }
      }
      @keyframes bsp-accent-stop-mid {
        0%, 20% { stop-color: #FF7B9D; }
        25%, 45% { stop-color: #4FB8E8; }
        50%, 70% { stop-color: #A66BFF; }
        75%, 95% { stop-color: #FF9F43; }
        100% { stop-color: #FF7B9D; }
      }
      @keyframes bsp-accent-stop-deep {
        0%, 20% { stop-color: #6B2A42; }
        25%, 45% { stop-color: #1E355E; }
        50%, 70% { stop-color: #35205C; }
        75%, 95% { stop-color: #6B3D14; }
        100% { stop-color: #6B2A42; }
      }

      /* button label crossfade: SKIP INTRO -> SKIP RECAP -> NEXT EPISODE */
      .bsp-label-1 {
        animation: bsp-accent-fill 12s ease-in-out infinite,
                   bsp-label-1 9s ease-in-out infinite;
      }
      .bsp-label-2 {
        animation: bsp-accent-fill 12s ease-in-out infinite,
                   bsp-label-2 9s ease-in-out infinite;
      }
      .bsp-label-3 {
        animation: bsp-accent-fill 12s ease-in-out infinite,
                   bsp-label-3 9s ease-in-out infinite;
      }
      @keyframes bsp-label-1 {
        0%, 29% { opacity: 1; }
        33%, 95% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes bsp-label-2 {
        0%, 33% { opacity: 0; }
        37%, 62% { opacity: 1; }
        66%, 100% { opacity: 0; }
      }
      @keyframes bsp-label-3 {
        0%, 66% { opacity: 0; }
        70%, 91% { opacity: 1; }
        95%, 100% { opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .bsp-accent-fill, .bsp-accent-stroke, .bsp-accent-stroke-light, .bsp-accent-stop, .bsp-accent-stop-mid, .bsp-accent-stop-deep {
          animation: none;
        }
        .bsp-label-1, .bsp-label-2, .bsp-label-3 { animation: none; }
        .bsp-label-1 { opacity: 1; fill: #FE5F8C; }
        .bsp-label-2, .bsp-label-3 { opacity: 0; }
      }
    </style>
  </defs>

  <g clip-path="url(#spm-window-clip)">
    <!-- browser chrome -->
    <rect x="0" y="36" width="550" height="348" fill="#F7DEEA"/>

    <!-- traffic lights -->
    <circle cx="16" cy="50" r="5" fill="#D89DB0"/>
    <circle cx="34" cy="50" r="5" fill="#D89DB0"/>
    <circle cx="52" cy="50" r="5" fill="#D89DB0"/>

    <!-- address bar -->
    <rect x="20" y="72" width="450" height="20" rx="10" fill="#FFFFFF" stroke="#E3B9C9" stroke-width="1.5"/>

    <circle cx="30" cy="82" r="5.5" fill="none" stroke="#B97690" stroke-width="1.5"/>
    <line x1="34" y1="86" x2="37" y2="90" stroke="#B97690" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="535" cy="76" r="1.6" fill="#B97690"/>
    <circle cx="535" cy="82" r="1.6" fill="#B97690"/>
    <circle cx="535" cy="88" r="1.6" fill="#B97690"/>

    <!-- video surface: Midnight Sapphire aura, blend layers composite against this base rect -->
    <g class="bsp-aura-container">
      <rect x="0" y="100" width="550" height="284" fill="#FAF8F2"/>
      <rect class="bsp-aura-layer" x="10" y="100" width="540" height="284" fill="url(#spm-aura-1)"/>
      <rect class="bsp-aura-layer" x="10" y="100" width="540" height="284" fill="url(#spm-aura-2)"/>
    </g>

    <!-- skip intro button -->
    <g transform="translate(478,322)">
      <rect class="bsp-accent-stroke" x="-56" y="-18" width="112" height="36" rx="18" fill="#5C3B47" stroke="#FE5F8C" stroke-width="1.5"/>
      <text
        class="bsp-label-1"
        x="0"
        y="5"
        text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="11"
        font-weight="700"
        letter-spacing="1"
        fill="#FE5F8C"
      >SKIP INTRO</text>
      <text
        class="bsp-label-2"
        x="0"
        y="5"
        text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="11"
        font-weight="700"
        letter-spacing="1"
        fill="#FE5F8C"
        opacity="0"
      >SKIP RECAP</text>
      <text
        class="bsp-label-3"
        x="0"
        y="5"
        text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="11"
        font-weight="700"
        letter-spacing="1"
        fill="#FE5F8C"
        opacity="0"
      >NEXT EPISODE</text>
    </g>

    <!-- progress bar -->
    <rect x="00" y="352" width="550" height="4" rx="2" fill="#74495A"/>
    <rect class="bsp-accent-fill" x="00" y="352" width="250" height="4" rx="2" fill="#FE5F8C"/>
    <circle class="bsp-accent-fill" cx="250" cy="354" r="6" fill="#FE5F8C" stroke="#FCE9F1" stroke-width="2"/>

    <!-- playback controls -->
    <g fill="#FCE9F1">
      <!-- play/pause -->
      <g transform="translate(30,372)">
        <rect x="-6" y="-8" width="4" height="16" rx="1"/>
        <rect x="2" y="-8" width="4" height="16" rx="1"/>
      </g>
      <!-- volume -->
      <g transform="translate(66,372)">
        <path d="M-8 -5 L-8 5 L-3 5 L3 10 L3 -10 L-3 -5 Z"/>
        <path d="M7 -4 A6 6 0 0 1 7 4" fill="none" stroke="#FCE9F1" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M5 -2 A3 3 0 0 1 5 2" fill="none" stroke="#FCE9F1" stroke-width="1.5" stroke-linecap="round"/>
      </g>
      <!-- next episode -->
      <g transform="translate(492,372)">
        <path d="M-8 -8 L4 0 L-8 8 Z"/>
        <rect x="6" y="-8" width="2.5" height="16" rx="1"/>
      </g>
      <!-- fullscreen -->
      <g transform="translate(526,372)" fill="none" stroke="#FCE9F1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-9 -3 L-9 -9 L-3 -9"/>
        <path d="M3 -9 L9 -9 L9 -3"/>
        <path d="M-9 3 L-9 9 L-3 9"/>
        <path d="M3 9 L9 9 L9 3"/>
      </g>
    </g>
  </g>

  <!-- window border, drawn outside the clip so corners stay crisp -->
  <rect x="0
" y="36" width="550" height="348" rx="8" fill="none" stroke="#E3B9C9" stroke-width="1"/>
</svg>
