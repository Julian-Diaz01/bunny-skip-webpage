<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Decorative starfield texture: scattered soft dots of varying size and opacity, used as an ambient background layer inside the Hero's dark atmospheric scene panel.">
